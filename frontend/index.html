<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | BellaSalón Studio & Spa</title>
  <!-- Iconos de FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <!-- Marca y Emblema de Salón de Belleza -->
      <div class="brand-mark" aria-hidden="true">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <p class="app-name">
        <i class="fa-solid fa-wand-magic-sparkles"></i> BellaSalón Studio
      </p>

      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Accede a tu cuenta para agendar y consultar tus citas de belleza</p>

      <form id="loginForm" novalidate>
        <p id="loginFormMessage" class="form-message" role="alert" style="display:none;"></p>
       
        <!-- Campo Correo Electrónico con Icono -->
        <div class="input-group">
          <label for="email">
            <i class="fa-solid fa-envelope"></i> Correo Electrónico
          </label>
          <div class="input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-at"></i></span>
            <input 
              type="email" 
              id="email" 
              placeholder="cliente@ejemplo.com" 
              autocomplete="email"
              required
            >
          </div>
          <span class="error-message" id="emailError"></span>
        </div>

        <!-- Campo Contraseña con Icono y Toggle -->
        <div class="input-group">
          <label for="password">
            <i class="fa-solid fa-lock"></i> Contraseña
          </label>
          <div class="password-field input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-key"></i></span>
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              minlength="6"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="error-message" id="passwordError"></span>
        </div>

        <!-- Botón de Ingreso con Icono -->
        <button type="submit" id="submitBtn">
          <i class="fa-solid fa-sparkles"></i> Ingresar al Salón
        </button>
      </form>

      <!-- Badge de Confianza y Calidad del Salón -->
      <div class="salon-trust-badge">
        <i class="fa-solid fa-heart"></i> Tu belleza y cuidado en manos profesionales
      </div>

      <div class="card-footer">
        <p>¿Aún no tienes cuenta? <a href="register.html"><i class="fa-solid fa-gem"></i> Regístrate aquí</a></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
