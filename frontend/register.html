<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cliente | BellaSalón Studio & Spa</title>
  <!-- Iconos de FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <!-- Marca y Emblema de Salón de Belleza -->
      <div class="brand-mark" aria-hidden="true">
        <i class="fa-solid fa-crown"></i>
      </div>
      <p class="app-name">
        <i class="fa-solid fa-wand-magic-sparkles"></i> BellaSalón Studio & Spa
      </p>

      <h2>Crear Cuenta</h2>
      <p class="subtitle">Regístrate para agendar tus tratamientos, elegir estilista y recibir atención prioritaria</p>

      <form id="registerForm" novalidate>
        
        <!-- Nombre Completo -->
        <div class="input-group">
          <label for="name">
            <i class="fa-solid fa-user"></i> Nombre Completo
          </label>
          <div class="input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-id-card"></i></span>
            <input 
              type="text" 
              id="name" 
              placeholder="Tu nombre y apellido" 
              autocomplete="name"
              required
            >
          </div>
          <span class="error-message" id="nameError"></span>
        </div>

        <!-- Correo Electrónico -->
        <div class="input-group">
          <label for="email">
            <i class="fa-solid fa-envelope"></i> Correo Electrónico
          </label>
          <div class="input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-at"></i></span>
            <input 
              type="email" 
              id="email" 
              placeholder="cliente@ejemplo.com" 
              autocomplete="email"
              required
            >
          </div>
          <span class="error-message" id="emailError"></span>
        </div>

        <!-- Teléfono para Confirmaciones de Salón -->
        <div class="input-group">
          <label for="phone">
            <i class="fa-solid fa-phone"></i> Teléfono (WhatsApp para confirmar cita)
          </label>
          <div class="input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-brands fa-whatsapp"></i></span>
            <input
              type="tel"
              id="phone"
              placeholder="300 123 4567"
              autocomplete="tel"
              inputmode="tel"
              required
            >
          </div>
          <span class="error-message" id="phoneError"></span>
        </div>

        <!-- Contraseña -->
        <div class="input-group">
          <label for="password">
            <i class="fa-solid fa-lock"></i> Contraseña
          </label>
          <div class="password-field input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-key"></i></span>
            <input
              type="password"
              id="password"
              placeholder="Mínimo 8 caracteres"
              minlength="8"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="error-message" id="passwordError"></span>
          <div class="password-strength" aria-live="polite">
            <div class="strength-track"><span id="strengthBar"></span></div>
            <span id="strengthLabel">Seguridad de contraseña</span>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div class="input-group">
          <label for="confirmPassword">
            <i class="fa-solid fa-shield-halved"></i> Confirmar Contraseña
          </label>
          <div class="password-field input-with-icon">
            <span class="field-icon" aria-hidden="true"><i class="fa-solid fa-check-double"></i></span>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repite tu contraseña"
              minlength="8"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="error-message" id="confirmPasswordError"></span>
        </div>

        <!-- Beneficios de Salón -->
        <div class="salon-perks">
          <div class="perk-item">
            <i class="fa-solid fa-calendar-check"></i>
            <span>Citas 24/7 en línea</span>
          </div>
          <div class="perk-item">
            <i class="fa-brands fa-whatsapp"></i>
            <span>Recordatorios WhatsApp</span>
          </div>
          <div class="perk-item">
            <i class="fa-solid fa-spa"></i>
            <span>Atención personalizada</span>
          </div>
        </div>

        <!-- reCAPTCHA Widget -->
        <div class="captcha-container">
          <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
          <span class="error-message" id="captchaError"></span>
        </div>

        <!-- Botón de Registro -->
        <button type="submit" id="registerBtn">
          <i class="fa-solid fa-sparkles"></i> Unirme al Club de Belleza
        </button>
      </form>

      <div class="card-footer">
        <p>¿Ya tienes una cuenta? <a href="index.html"><i class="fa-solid fa-right-to-bracket"></i> Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script src="register.js"></script>
</body>
</html>
