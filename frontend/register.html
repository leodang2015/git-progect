<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-mark" aria-hidden="true">SR</div>
      <p class="app-name">Sistema de Reservas</p>
      <h2>Crear una cuenta</h2>
      <p class="subtitle">Llena los datos para registrarte en la plataforma</p>

      <form id="registerForm" novalidate>
        
        <div class="input-group">
          <label for="name">Nombre Completo</label>
          <input 
            type="text" 
            id="name" 
            placeholder="Tu nombre y apellido" 
            autocomplete="name"
            required
          >
          <span class="error-message" id="nameError"></span>
        </div>

       
        <div class="input-group">
          <label for="email">Correo Electrónico</label>
          <input 
            type="email" 
            id="email" 
            placeholder="ejemplo@correo.com" 
            autocomplete="email"
            required
          >
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="input-group">
          <label for="phone">Teléfono</label>
          <input
            type="tel"
            id="phone"
            placeholder="300 123 4567"
            autocomplete="tel"
            inputmode="tel"
            required
          >
          <span class="error-message" id="phoneError"></span>
        </div>

      
        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input
              type="password"
              id="password"
              placeholder="Mínimo 6 caracteres"
              minlength="6"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle" data-target="password" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="error-message" id="passwordError"></span>
          <div class="password-strength" aria-live="polite">
            <div class="strength-track"><span id="strengthBar"></span></div>
            <span id="strengthLabel">Seguridad de contraseña</span>
          </div>
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <div class="password-field">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repite tu contraseña"
              minlength="6"
              autocomplete="new-password"
              required
            >
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Mostrar contraseña" title="Mostrar contraseña">Mostrar</button>
          </div>
          <span class="error-message" id="confirmPasswordError"></span>
        </div>

        <div class="captcha-container">
          <label class="captcha-box" for="captchaCheck">
            <input type="checkbox" id="captchaCheck">
            <span class="captcha-checkmark" aria-hidden="true"></span>
            <span class="captcha-label">No soy un robot</span>
            <span class="captcha-brand">
              <strong>reCAPTCHA</strong>
              <small>Privacidad - Condiciones</small>
            </span>
          </label>
          <span class="error-message" id="captchaError"></span>
        </div>

        
        <button type="submit" id="registerBtn">Registrarse</button>
      </form>

      <div class="card-footer">
        <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión aquí</a></p>
      </div>
    </div>
  </div>

  <script src="register.js"></script>
</body>
</html>
